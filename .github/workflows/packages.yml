name: Pacotes Linux
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Dependências e índices de fontes
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev libqt6opengl6-dev qt6-wayland libgtk-3-dev libx11-dev libvulkan-dev glslang-tools libsqlite3-dev libarchive-dev dpkg-dev makeself patchelf file desktop-file-utils libfuse2t64
      - name: Compilar e testar
        run: |
          BUILD_JOBS=2 sh build.sh
          ctest --test-dir build --output-on-failure
      - name: Gerar e verificar formatos
        run: bash tools/build-distribution.sh build dist
      - uses: actions/upload-artifact@v4
        with:
          name: GPU-PRO-linux-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14
